! ===================== ISP router (simulated Internet) =====================
! AS 65100. Owns two "Internet" addresses on its loopback: 8.8.8.8 and 1.1.1.1
! Sends a default route to our edge router r1 over eBGP.
frr version 10.2.1
frr defaults traditional
hostname isp
log file /var/log/frr/frr.log informational
service integrated-vtysh-config
!
interface lo
 ip address 8.8.8.8/32
 ip address 1.1.1.1/32
exit
!
interface eth1
 description link to customer r1 (AS 65001)
 ip address 203.0.113.1/30
exit
!
! Only accept our customer's LAN prefixes
ip prefix-list FROM-CUSTOMER seq 10 permit 192.168.10.0/24
ip prefix-list FROM-CUSTOMER seq 20 permit 192.168.20.0/24
!
! Only announce the Internet test prefixes (the default route is added
! by "default-originate" below)
ip prefix-list TO-CUSTOMER seq 10 permit 8.8.8.8/32
ip prefix-list TO-CUSTOMER seq 20 permit 1.1.1.1/32
!
route-map FROM-CUSTOMER permit 10
 match ip address prefix-list FROM-CUSTOMER
exit
!
route-map TO-CUSTOMER permit 10
 match ip address prefix-list TO-CUSTOMER
exit
!
router bgp 65100
 bgp router-id 203.0.113.1
 bgp log-neighbor-changes
 neighbor 203.0.113.2 remote-as 65001
 neighbor 203.0.113.2 description customer-r1
 !
 address-family ipv4 unicast
  network 8.8.8.8/32
  network 1.1.1.1/32
  neighbor 203.0.113.2 default-originate
  neighbor 203.0.113.2 route-map FROM-CUSTOMER in
  neighbor 203.0.113.2 route-map TO-CUSTOMER out
 exit-address-family
exit
!
