! ===================== r1 - edge router =====================
! AS 65001. eBGP to the ISP, OSPF area 0 towards r2 and r3.
! Takes the default route learned from the ISP and injects it into OSPF.
frr version 10.2.1
frr defaults traditional
hostname r1
log file /var/log/frr/frr.log informational
service integrated-vtysh-config
!
interface lo
 ip address 10.255.0.1/32
 ip ospf area 0
exit
!
interface eth1
 description eBGP to ISP (AS 65100)
 ip address 203.0.113.2/30
exit
!
interface eth2
 description to r2
 ip address 10.0.12.1/30
 ip ospf area 0
 ip ospf network point-to-point
exit
!
interface eth3
 description to r3
 ip address 10.0.13.1/30
 ip ospf area 0
 ip ospf network point-to-point
exit
!
router ospf
 ospf router-id 10.255.0.1
 passive-interface lo
 ! Advertise a default route into OSPF, but only while we have one from BGP
 default-information originate
exit
!
! What we accept from the ISP: the default route and the test prefixes
ip prefix-list FROM-ISP seq 5 permit 0.0.0.0/0
ip prefix-list FROM-ISP seq 10 permit 8.8.8.8/32
ip prefix-list FROM-ISP seq 20 permit 1.1.1.1/32
!
! What we announce to the ISP: only our two LAN subnets
ip prefix-list TO-ISP seq 10 permit 192.168.10.0/24
ip prefix-list TO-ISP seq 20 permit 192.168.20.0/24
!
route-map FROM-ISP permit 10
 match ip address prefix-list FROM-ISP
exit
!
route-map TO-ISP permit 10
 match ip address prefix-list TO-ISP
exit
!
router bgp 65001
 bgp router-id 10.255.0.1
 bgp log-neighbor-changes
 neighbor 203.0.113.1 remote-as 65100
 neighbor 203.0.113.1 description ISP
 !
 address-family ipv4 unicast
  ! The LAN subnets are learned through OSPF from r4, so BGP can announce them
  network 192.168.10.0/24
  network 192.168.20.0/24
  neighbor 203.0.113.1 route-map FROM-ISP in
  neighbor 203.0.113.1 route-map TO-ISP out
 exit-address-family
exit
!
