! ===================== r2 - core router =====================
! Pure OSPF area 0 router between the edge (r1) and the LAN gateway (r4).
frr version 10.2.1
frr defaults traditional
hostname r2
log file /var/log/frr/frr.log informational
service integrated-vtysh-config
!
interface lo
 ip address 10.255.0.2/32
 ip ospf area 0
exit
!
interface eth1
 description to r1
 ip address 10.0.12.2/30
 ip ospf area 0
 ip ospf network point-to-point
exit
!
interface eth2
 description to r3
 ip address 10.0.23.1/30
 ip ospf area 0
 ip ospf network point-to-point
exit
!
interface eth3
 description to r4
 ip address 10.0.24.1/30
 ip ospf area 0
 ip ospf network point-to-point
exit
!
router ospf
 ospf router-id 10.255.0.2
 passive-interface lo
exit
!
