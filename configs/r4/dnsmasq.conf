# dnsmasq is used here ONLY as a DHCP server (DNS is switched off).

# port=0 turns off the DNS part of dnsmasq
port=0

# Hand out addresses only on the two LAN VLAN interfaces
interface=eth3.10
interface=eth3.20
bind-interfaces

# Write a detailed log of every DHCP conversation - very useful when troubleshooting
log-dhcp
log-facility=/var/log/dnsmasq.log

# ---- VLAN 10 - Staff -----------------------------------------------------
dhcp-range=set:staff,192.168.10.100,192.168.10.150,255.255.255.0,1h
dhcp-option=tag:staff,option:router,192.168.10.1

# ---- VLAN 20 - Guest -----------------------------------------------------
dhcp-range=set:guest,192.168.20.100,192.168.20.150,255.255.255.0,1h
dhcp-option=tag:guest,option:router,192.168.20.1
