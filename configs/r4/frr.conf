! ===================== r4 - LAN gateway =====================
! OSPF towards r2 and r3. Default gateway for both LAN VLANs.
! The VLAN sub-interfaces eth3.10 and eth3.20 are created by /lab/setup.sh
frr version 10.2.1
frr defaults traditional
hostname r4
log file /var/log/frr/frr.log informational
service integrated-vtysh-config
!
interface lo
 ip address 10.255.0.4/32
 ip ospf area 0
exit
!
interface eth1
 description to r2
 ip address 10.0.24.2/30
 ip ospf area 0
 ip ospf network point-to-point
exit
!
interface eth2
 description to r3
 ip address 10.0.34.2/30
 ip ospf area 0
 ip ospf network point-to-point
exit
!
interface eth3.10
 description VLAN 10 - Staff LAN gateway
 ip address 192.168.10.1/24
 ip ospf area 0
exit
!
interface eth3.20
 description VLAN 20 - Guest LAN gateway
 ip address 192.168.20.1/24
 ip ospf area 0
exit
!
router ospf
 ospf router-id 10.255.0.4
 ! Never form OSPF neighbors on the user LANs, just advertise the subnets
 passive-interface lo
 passive-interface eth3.10
 passive-interface eth3.20
exit
!
